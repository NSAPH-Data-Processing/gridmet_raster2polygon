# DEPRECATED: Use zcta_cannon_core.yaml or zcta_cannon_popweighted.yaml instead.
# This config is kept for backward compatibility and defaults to core (unweighted) paths.
name: zcta
base_path: data/zcta

dirs:
  input:
    raw: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/raw
    shapefiles: /n/dominici_lab/lab/lego/geoboundaries/us_geoboundaries__census/us_shapefile__census/zcta_yearly/

  intermediate: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/.zcta_daily__intermediate

  output: 
    core:
      daily: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/core/zcta_daily
      yearly: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/core/zcta_yearly
    seasonal: 
      yearly: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/seasonal/zcta_yearly
