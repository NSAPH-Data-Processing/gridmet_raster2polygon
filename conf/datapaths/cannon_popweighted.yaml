# Population-weighted datapaths for all geographies on Cannon cluster
# Usage: datapaths=cannon_popweighted shapefiles=county (or zcta) population.weighting.enabled=true
# Geography is determined by the shapefiles config; both county and zcta
# local directory structures are created under data/{base_path}.
name: cannon_popweighted
base_path: population_weighted

dirs:
  population:
    input:
      raw: null
    output: null
  county:
    input:
      raw: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/raw
      shapefiles: /n/dominici_lab/lab/lego/geoboundaries/us_geoboundaries__census/us_shapefile__census/county_yearly
    intermediate: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/.county_daily__intermediate
    output:
      daily: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/county_daily
      yearly: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/county_yearly
  zcta:
    input:
      raw: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/raw
      shapefiles: /n/dominici_lab/lab/lego/geoboundaries/us_geoboundaries__census/us_shapefile__census/zcta_yearly
    intermediate: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/.zcta_daily__intermediate
    output:
      daily: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/zcta_daily
      yearly: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/zcta_yearly
