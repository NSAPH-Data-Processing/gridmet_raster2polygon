# Template for datapaths configuration.
# Consolidated configs (cannon_core, cannon_popweighted) store all geographies
# under data/{base_path}. When name is null, scripts use polygon_name to
# determine the geography subdirectory under data/{base_path}.
name: null
base_path: null  # e.g. core, population_weighted, seasonal; local path is data/{base_path}
product_name: null  # optional override for final filename token; defaults to base_path

dirs:
  population:
    input:
      raw: null
    output: null
  county:
    input:
      raw: null
      shapefiles: null
      population: null
    intermediate: null
    output:
      daily: null
      yearly: null
  zcta:
    input:
      raw: null
      shapefiles: null
      population: null
    intermediate: null
    output:
      daily: null
      yearly: null
