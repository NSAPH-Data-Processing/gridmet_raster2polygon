# Template for datapaths configuration.
# Consolidated configs (cannon_core, cannon_popweighted) store all geographies
# under a single base_path. When name is null, scripts use polygon_name to
# determine the geography subdirectory under base_path.
name: null
base_path: null  # e.g. data/core or data/population_weighted

dirs:
  population:
    input:
      raw: null
    output: null
  county:
    input:
      raw: null
      shapefiles: null
      population: null
    intermediate: null
    output:
      daily: null
      yearly: null
  zcta:
    input:
      raw: null
      shapefiles: null
      population: null
    intermediate: null
    output:
      daily: null
      yearly: null
