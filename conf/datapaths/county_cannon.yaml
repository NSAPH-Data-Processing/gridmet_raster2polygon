# DEPRECATED: Use county_cannon_core.yaml or county_cannon_popweighted.yaml instead.
# This config is kept for backward compatibility and defaults to core (unweighted) paths.
name: county
base_path: data/county

dirs:
  input:
    raw: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/raw
    shapefiles: /n/dominici_lab/lab/lego/geoboundaries/us_geoboundaries__census/us_shapefile__census/county_yearly
    population: /n/dominici_lab/lab/lego/social/world_population__sedac

  intermediate: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/.county_daily__intermediate

  output: 
    core: 
      daily: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/county_daily
      yearly: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/county_yearly
    population_weighted:
      daily: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/county_daily
      yearly: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/population_weighted/county_yearly
    seasonal: 
      yearly: /n/dominici_lab/lab/lego/environmental/meteorology__gridmet/seasonal/county_yearly
