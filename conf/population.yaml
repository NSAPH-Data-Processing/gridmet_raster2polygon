# @package population
# Population data configuration for population-weighted gridMET aggregation
# 
# Data source from Harvard Dataverse:
# - Population Count: https://doi.org/10.7910/DVN/C0LVYI

# Default population type to use for weighting
default_type: count

# Directory to store population data
data_dir: /n/dominici_lab/Lab/data_processing/shreya_gridmet_raster2polygon/gridmet_raster2polygon/data/population

# Population weighting configuration
weighting:
  enabled: false  # Set to true to enable population weighting
  method: mean    # Options: mean (population-weighted mean)

# Population Count Data Configuration
count:
  doi: "https://doi.org/10.7910/DVN/C0LVYI"
  description: "Annual population counts at grid cell level"
  resolution: "1km x 1km grid"
  coverage: "Contiguous United States"
  
  # File mappings for different years
  # Add file_id from Dataverse or direct URL
  file_map:
    2000:
      filename: "population_count_2000.tif"
      file_id: null  # Add Dataverse file ID here
      url: null      # Or add direct download URL
    2010:
      filename: "population_count_2010.tif"
      file_id: null
      url: null
    2020:
      filename: "population_count_2020.tif"
      file_id: null
      url: null
