defaults:
  - _self_
  - datapaths: cannon_popweighted  # cannon_core or cannon_popweighted
  - gridmet
  - population
  - snakemake
  - seasons
  - shapefiles: zcta   # zcta, county
# == aggregation args
year: 2000
var: sph  # see the gridmet key in gridmet.yaml for valid options
downscaling_factor: 4

# == shapefile download args
polygon_name: ${hydra:runtime.choices.shapefiles}  # overwritten from cmd
shapefile_year: 2020  # used when running download_shapefiles.py standalone

show_progress: true
plot_output: true  # plots the first day of each var aggregation for debugging
hydra:
  run:
    dir: logs/${now:%Y-%m-%d}/${now:%H-%M-%S}
